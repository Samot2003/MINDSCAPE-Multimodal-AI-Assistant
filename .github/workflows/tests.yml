name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mismo rango que el README. google-generativeai 0.3.2 necesita Python 3.9 o superior.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: chatbot_mental/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: chatbot_mental/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Gemini está simulado en las pruebas: no hace falta API Key.
      - run: python -m pytest tests
